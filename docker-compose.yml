# Somente o Postgres local para desenvolvimento. A API e o front rodam fora do Docker.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cobranca
      POSTGRES_USER: cobranca
      POSTGRES_PASSWORD: cobranca
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
