# Blueprint do Render: cria a API a partir deste arquivo (New > Blueprint). Valores secretos são
# preenchidos no painel do Render (sync: false), NUNCA aqui.
services:
  - type: web
    name: mensalidades-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL        # jdbc:postgresql://HOST/DB?sslmode=require  (Neon)
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN      # URL do front no Cloudflare Pages, sem barra no final
        sync: false
      - key: DEMO_TOKEN          # gere com: openssl rand -hex 16
        sync: false
      - key: DEMO_WHATSAPP
        sync: false
      - key: ASAAS_BASE_URL
        value: https://api-sandbox.asaas.com
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
