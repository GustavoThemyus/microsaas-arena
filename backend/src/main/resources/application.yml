spring:
  application:
    name: cobranca
  config:
    # Lê o .env da raiz do projeto (segredos locais, ignorado pelo git). Variáveis de ambiente reais têm prioridade.
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/cobranca}
    username: ${DB_USER:cobranca}
    password: ${DB_PASSWORD:cobranca}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  main:
    lazy-initialization: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  profiles:
    # "demo" liga seed e rotas /api/demo/**. Em um produto real isso ficaria desligado.
    default: demo

server:
  error:
    include-message: always
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  escola-id: 1
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}
  # Se vazio, a API fica aberta (somente desenvolvimento local). Em produção, SEMPRE definir.
  demo-token: ${DEMO_TOKEN:}
  # Telefone usado nos alunos fictícios (formato 55DDNÚMERO). Padrão: número claramente fictício.
  demo-whatsapp: ${DEMO_WHATSAPP:5583900000000}
  asaas:
    # Esta demo SÓ aceita o sandbox (o cliente recusa qualquer outra URL).
    base-url: ${ASAAS_BASE_URL:https://api-sandbox.asaas.com}
    api-key: ${ASAAS_API_KEY:}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
